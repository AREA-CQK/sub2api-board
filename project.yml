name: Sub2APIBoard
options:
  bundleIdPrefix: com.changqk
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.4.0
    CURRENT_PROJECT_VERSION: 9
targets:
  Sub2APIBoard:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.changqk.Sub2APIBoard
        PRODUCT_NAME: Sub2APIBoard
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Sub2APIBoard.entitlements
        KEYCHAIN_ACCESS_GROUP: $(AppIdentifierPrefix)com.changqk.Sub2APIBoard.shared
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: Sub2APIBoardWidget
        embed: true
  Sub2APIBoardWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.changqk.Sub2APIBoard.Widget
        PRODUCT_NAME: Sub2APIBoardWidget
        INFOPLIST_FILE: Config/Widget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Sub2APIBoardWidget.entitlements
        KEYCHAIN_ACCESS_GROUP: $(AppIdentifierPrefix)com.changqk.Sub2APIBoard.shared
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  Sub2APIBoardTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Sub2APIBoard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.changqk.Sub2APIBoardTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Sub2APIBoard:
    build:
      targets:
        Sub2APIBoard: all
        Sub2APIBoardWidget: all
        Sub2APIBoardTests: [test]
    test:
      targets:
        - Sub2APIBoardTests
